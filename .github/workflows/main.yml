name: Build APK

"on":
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Extract game
    run: |
      set -e
      mkdir -p app
      unzip -q game-music.zip -d app
      test -f app/myket-game/config.xml
      test -d app/myket-game/www

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20.17.0

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Install Android SDK
    run: |
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

  - name: Install Cordova
    run: npm install -g cordova@12

  - name: Prepare Android project
    working-directory: app/myket-game
    run: |
      set -e
      cordova platform add android@15.0.0

      if [ -d myket-iab-plugin ]; then
        cordova plugin add ./myket-iab-plugin
      else
        echo "Local Myket plugin folder not found; checking project plugins."
        cordova plugin ls
      fi

  - name: Build release APK
    working-directory: app/myket-game
    shell: bash
    run: |
      set -o pipefail
      cordova build android --release 2>&1 | tee build.log

  - name: Save build logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: build-diagnostics
      path: |
        app/myket-game/build.log
        app/myket-game/platforms/android/cordova/
      if-no-files-found: ignore
      retention-days: 7

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: game-apk
      path: app/myket-game/platforms/android/app/build/outputs/apk/release/*.apk
      if-no-files-found: error
