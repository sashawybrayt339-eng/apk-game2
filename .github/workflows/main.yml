name: Build APK

"on":
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - name: Extract game
    run: |
      mkdir -p app
      unzip -q game-music.zip -d app

  - name: Check project files
    run: |
      test -f app/myket-game/config.xml
      test -d app/myket-game/myket-iab-plugin

  - name: Portrait and signing key
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
      KS_ALIAS: ${{ secrets.KS_ALIAS }}
      KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
    shell: bash
    run: |
      set -e
      sed -i 's/value="landscape"/value="portrait"/' app/myket-game/config.xml

      KS=$(find . -maxdepth 1 -type f \( -name "*.jks" -o -name "*.keystore" \) -print -quit)

      if [ -n "$KS" ]; then
        cp "$KS" app/myket-game/game.keystore
        python3 -c "import json,os; json.dump({'android':{'release':{'keystore':'game.keystore','storePassword':os.environ['KS_PASS'],'alias':os.environ['KS_ALIAS'],'password':os.environ['KS_KEYPASS'],'keystoreType':''}}}, open('app/myket-game/build.json','w'))"
      fi

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: 8.10.2

  - name: Install Android SDK
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;33.0.2" "platforms;android-33"

  - name: Install Cordova
    run: npm install -g cordova@12

  - name: Build APK
    shell: bash
    working-directory: app/myket-game
    run: |
      set -o pipefail
      cordova platform add android@12
      cordova plugin add ./myket-iab-plugin
      cordova build android --release 2>&1 | tee build.log

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: game-apk
      path: app/myket-game/platforms/android/app/build/outputs/apk/release/*.apk
      if-no-files-found: error

  - name: Show build errors
    if: failure()
    working-directory: app/myket-game
    run: |
      if [ -f build.log ]; then
        grep -n -E "error:|FAILURE|What went wrong|Could not|not found|does not exist|Unresolved" -A6 build.log | head -80 || true
      fi
