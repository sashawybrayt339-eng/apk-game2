name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir app && unzip -q myket-game-project.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"
      - run: npm install -g cordova@12
      - name: Build
        shell: bash
        working-directory: app/myket-game
        run: |
          cordova platform add android@12
          cordova plugin add ./myket-iab-plugin
          cordova build android --release --buildConfig=build.json -- --packageType=apk 2>&1 | tee build.log
      - name: Show error
        if: failure()
        working-directory: app/myket-game
        run: |
          { echo '```'; grep -n -E "error:|^e: |FAILURE|What went wrong|Could not|not found|does not exist|Unresolved" -A6 build.log | head -80; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/myket-game/platforms/android/app/build/outputs/apk/release/*.apk
