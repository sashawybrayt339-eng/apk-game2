name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game
        run: |
          if [ -f gm.txt ]; then
            base64 -d gm.txt > game.zip
          else
            cp game-music.zip game.zip
          fi
          mkdir app && unzip -q game.zip -d app
      - name: Portrait and signing key
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
        run: |
          sed -i 's/value="landscape"/value="portrait"/' app/myket-game/config.xml
          KS=$(ls *.jks *.keystore 2>/dev/null | head -1)
          if [ -n "$KS" ]; then
            echo "using your keystore: $KS"
            cp "$KS" app/myket-game/game.keystore
            python3 -c "import json,os; json.dump({'android':{'release':{'keystore':'game.keystore','storePassword':os.environ['KS_PASS'],'alias':os.environ['KS_ALIAS'],'password':os.environ['KS_KEYPASS'],'keystoreType':''}}}, open('app/myket-game/build.json','w'))"
          else
            echo "no keystore uploaded, using the test key"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"
      - run: npm install -g cordova@12
      - name: Build
        shell: bash
        working-directory: app/myket-game
        run: |
          cordova platform add android@12
          cordova plugin add ./myket-iab-plugin
          cordova build android --release --buildConfig=build.json -- --packageType=apk 2>&1 | tee build.log
      - name: Check signature
        run: |
          APK=$(ls app/myket-game/platforms/android/app/build/outputs/apk/release/*.apk | head -1)
          GOT=$(keytool -printcert -jarfile "$APK" | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          WANT=a70bbe1098d13c9c65da6ace1eb6995b102b26b6
          if [ "$GOT" = "$WANT" ]; then echo "SIGNATURE MATCH" >> $GITHUB_STEP_SUMMARY; else echo "SIGNATURE MISMATCH. APK=$GOT" >> $GITHUB_STEP_SUMMARY; fi
      - name: Show error
        if: failure()
        working-directory: app/myket-game
        run: |
          { echo '```'; grep -n -E "error:|^e: |FAILURE|What went wrong|Could not|not found|does not exist|Unresolved" -A6 build.log | head -80; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/myket-game/platforms/android/app/build/outputs/apk/release/*.apk
