name: Build Game APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'game-music-updated.zip'
      - '.github/workflows/build-game.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game
        run: |
          if [ ! -f game-music-updated.zip ]; then
            echo "game-music-updated.zip not found in repo root" >> $GITHUB_STEP_SUMMARY
            ls -la
            exit 1
          fi
          mkdir app && unzip -q game-music-updated.zip -d app
          ls app
      - name: Signing key
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
        run: |
          KS=$(ls *.jks *.keystore 2>/dev/null | head -1)
          if [ -n "$KS" ]; then
            echo "using your keystore: $KS"
            cp "$KS" app/myket-game/game.keystore
            python3 -c "import json,os; json.dump({'android':{'release':{'keystore':'game.keystore','storePassword':os.environ['KS_PASS'],'alias':os.environ['KS_ALIAS'],'password':os.environ['KS_KEYPASS'],'keystoreType':''}}}, open('app/myket-game/build.json','w'))"
          else
            echo "no keystore in repo root, using the key inside the zip"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"
      - run: npm install -g cordova@12
      - name: Build
        shell: bash
        working-directory: app/myket-game
        run: |
          cordova platform add android@12
          cordova plugin add ./myket-iab-plugin
          cordova build android --release --buildConfig=build.json -- --packageType=apk 2>&1 | tee build.log
      - name: Show signature
        run: |
          APK=$(ls app/myket-game/platforms/android/app/build/outputs/apk/release/*.apk | head -1)
          {
            echo "### APK signature (compare with Myket)"
            $ANDROID_HOME/build-tools/33.0.2/apksigner verify --print-certs "$APK" 2>&1 | grep -E "SHA-(1|256) digest" | sed 's/^/- /'
          } >> $GITHUB_STEP_SUMMARY || true
      - name: Show error
        if: failure()
        working-directory: app/myket-game
        run: |
          { echo '```'; grep -n -E "error:|^e: |FAILURE|What went wrong|Could not|not found|does not exist|Unresolved" -A6 build.log | head -80; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/myket-game/platforms/android/app/build/outputs/apk/release/*.apk
